# EstágioHub — full stack. `make up` builds and waits until every container is healthy.
name: estagiohub

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
  interval: 5s
  timeout: 4s
  retries: 40
  start_period: 15s

x-postgres: &postgres
  image: postgres:16-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U estagiohub -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 30
  networks: [backend]

x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ausente - rode make env}
  RABBITMQ_URL: amqp://estagiohub:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD ausente - rode make env}@rabbitmq:5672/
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # ------------------------------------------------------------------ broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: estagiohub
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD ausente - rode make env}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]

  # --------------------------------------------------------------- databases
  user-db:
    <<: *postgres
    environment:
      POSTGRES_USER: estagiohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente - rode make env}
      POSTGRES_DB: users
    volumes:
      - user-db-data:/var/lib/postgresql/data

  internship-db:
    <<: *postgres
    environment:
      POSTGRES_USER: estagiohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente - rode make env}
      POSTGRES_DB: internships
    volumes:
      - internship-db-data:/var/lib/postgresql/data

  application-db:
    <<: *postgres
    environment:
      POSTGRES_USER: estagiohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente - rode make env}
      POSTGRES_DB: applications
    volumes:
      - application-db-data:/var/lib/postgresql/data

  document-db:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: estagiohub
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD ausente - rode make env}
    volumes:
      - document-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]

  notification-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD ausente - rode make env}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - notification-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  # ---------------------------------------------------------------- services
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: estagiohub/user-service
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://estagiohub:${POSTGRES_PASSWORD}@user-db:5432/users
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-120}
    depends_on:
      user-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    networks: [backend]

  internship-service:
    build:
      context: .
      dockerfile: services/internship-service/Dockerfile
    image: estagiohub/internship-service
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://estagiohub:${POSTGRES_PASSWORD}@internship-db:5432/internships
    depends_on:
      internship-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    networks: [backend]

  application-service:
    build:
      context: .
      dockerfile: services/application-service/Dockerfile
    image: estagiohub/application-service
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://estagiohub:${POSTGRES_PASSWORD}@application-db:5432/applications
    depends_on:
      application-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    networks: [backend]

  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    image: estagiohub/document-service
    environment:
      <<: *app-env
      MONGO_URL: mongodb://estagiohub:${MONGO_PASSWORD}@document-db:27017/?authSource=admin
      FILES_DIR: /data/files
    volumes:
      - document-files:/data/files
    depends_on:
      document-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    networks: [backend]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: estagiohub/notification-service
    environment:
      <<: *app-env
      REDIS_URL: redis://:${REDIS_PASSWORD}@notification-redis:6379/0
    depends_on:
      notification-redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    networks: [backend]

  # ----------------------------------------------------------------- gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: estagiohub/api-gateway
    environment:
      <<: *app-env
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"
    depends_on:
      user-service: { condition: service_healthy }
      internship-service: { condition: service_healthy }
      application-service: { condition: service_healthy }
      document-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck: *app-healthcheck
    networks: [backend, edge]

  # ---------------------------------------------------------------- frontend
  web-frontend:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
    image: estagiohub/web-frontend
    environment:
      GATEWAY_URL: http://api-gateway:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    depends_on:
      api-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    networks: [edge]

  # ------------------------------------------------------- tooling (profile)
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: scripts/tools.Dockerfile
    image: estagiohub/tools
    working_dir: /work
    volumes:
      - .:/work
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ausente - rode make env}
      GATEWAY_URL: http://api-gateway:8000
      FRONTEND_URL: http://web-frontend:8080
    networks: [edge]

volumes:
  rabbitmq-data:
  user-db-data:
  internship-db-data:
  application-db-data:
  document-db-data:
  document-files:
  notification-redis-data:

networks:
  backend:
  edge:
