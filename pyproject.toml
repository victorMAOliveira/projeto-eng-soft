# Workspace-level tooling configuration (lint/format). Each component and
# service has its own pyproject/requirements; this file is not a package.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D100", "D101", "D103"]
ignore = [
    "B008", # FastAPI dependencies are declared as default arguments by design
    "E501", # line length is enforced by `ruff format`; long pt-BR string literals are allowed
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D100", "D101", "D103"]
"**/alembic/**" = ["D100", "D103"]
"**/conftest.py" = ["D100", "D103"]

[tool.ruff.lint.isort]
known-first-party = [
    "eh_auth", "eh_events", "eh_db", "eh_observability", "eh_http", "eh_ui",
]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs code inside greenlets; without this, lines
# executed after a greenlet switch are reported as not covered.
concurrency = ["thread", "greenlet"]
