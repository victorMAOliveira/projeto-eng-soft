[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eh-events"
version = "1.0.0"
description = "EstágioHub component: event contracts (pydantic), async RabbitMQ publisher/consumer with retry, idempotency and DLQ."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "aio-pika>=9.4,<10",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/eh_events"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
