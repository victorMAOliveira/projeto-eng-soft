[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eh-db"
version = "1.0.0"
description = "EstágioHub component: async SQLAlchemy 2 engine/session, base repository, Alembic helpers and SQL idempotency store."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "aiosqlite>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/eh_db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
