[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eh-http"
version = "1.0.0"
description = "EstágioHub component: resilient httpx client with timeout, retry/backoff and circuit breaker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/eh_http"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
