[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eh-observability"
version = "0.1.0"
description = "EstágioHub component: JSON logging, correlation-id middleware and health/ready/version routes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/eh_observability"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
