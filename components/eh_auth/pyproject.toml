[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eh-auth"
version = "0.1.0"
description = "EstágioHub component: JWT creation/validation, argon2 password hashing and FastAPI role guards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyJWT>=2.8,<3",
    "argon2-cffi>=23.1",
    "fastapi>=0.115,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/eh_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
