name: CI

on:
  push:
    branches: ["**"]
    tags: ["sprint-*"]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Testes (unitários + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make env
      - run: make test

  build:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: make env
      - run: docker compose build
